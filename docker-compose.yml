services:
  nox-sync:
    image: ghcr.io/mapherez/nox-sync:latest
    container_name: nox-sync
    restart: unless-stopped
    ports:
      - "5710:8080"
    environment:
      NOX_SYNC_ADDR: ":8080"
      NOX_SYNC_DATA_DIR: "/data"
    volumes:
      - nox-sync-data:/data

volumes:
  nox-sync-data:
