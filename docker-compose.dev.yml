services:
  nox-sync:
    build:
      context: ./backend
    image: nox-sync:dev
    container_name: nox-sync-dev
    restart: unless-stopped
    ports:
      - "5710:8080"
    environment:
      NOX_SYNC_ADDR: ":8080"
      NOX_SYNC_DATA_DIR: "/data"
      NOX_SYNC_PUBLIC_URL: "${NOX_SYNC_PUBLIC_URL:-http://localhost:5710}"
      NOX_SYNC_GOOGLE_CLIENT_ID: "${NOX_SYNC_GOOGLE_CLIENT_ID:-}"
      NOX_SYNC_GOOGLE_CLIENT_SECRET: "${NOX_SYNC_GOOGLE_CLIENT_SECRET:-}"
      NOX_SYNC_ADMIN_EMAILS: "${NOX_SYNC_ADMIN_EMAILS:-}"
    volumes:
      - ./data:/data
