name: Release Obsidian plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: plugin
        run: npm ci

      - name: Typecheck
        working-directory: plugin
        run: npm run typecheck

      - name: Test
        working-directory: plugin
        run: npm run test

      - name: Build plugin
        working-directory: plugin
        run: npm run build

      - name: Read and validate version
        id: version
        run: |
          VERSION=$(node -p "require('./plugin/package.json').version")
          MANIFEST_VERSION=$(node -p "require('./plugin/manifest.json').version")
          ROOT_MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          MIN_APP_VERSION=$(node -p "require('./plugin/manifest.json').minAppVersion")
          ROOT_MIN_APP_VERSION=$(node -p "require('./manifest.json').minAppVersion")
          PLUGIN_VERSIONS_MIN=$(node -p "require('./plugin/versions.json')['$VERSION']")
          ROOT_VERSIONS_MIN=$(node -p "require('./versions.json')['$VERSION']")

          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "package.json version ($VERSION) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

          if [ "$VERSION" != "$ROOT_MANIFEST_VERSION" ]; then
            echo "package.json version ($VERSION) does not match root manifest.json version ($ROOT_MANIFEST_VERSION)"
            exit 1
          fi

          if [ "$MIN_APP_VERSION" != "$ROOT_MIN_APP_VERSION" ]; then
            echo "plugin manifest minAppVersion ($MIN_APP_VERSION) does not match root manifest minAppVersion ($ROOT_MIN_APP_VERSION)"
            exit 1
          fi

          if [ "$MIN_APP_VERSION" != "$PLUGIN_VERSIONS_MIN" ]; then
            echo "plugin versions.json entry for $VERSION ($PLUGIN_VERSIONS_MIN) does not match minAppVersion ($MIN_APP_VERSION)"
            exit 1
          fi

          if [ "$MIN_APP_VERSION" != "$ROOT_VERSIONS_MIN" ]; then
            echo "root versions.json entry for $VERSION ($ROOT_VERSIONS_MIN) does not match minAppVersion ($MIN_APP_VERSION)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestations
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --draft \
            plugin/dist/main.js \
            plugin/dist/manifest.json \
            plugin/dist/styles.css
