name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: Go fuzz tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run storage fuzz tests
        working-directory: backend
        run: go test ./internal/storage -fuzz=FuzzNormalizeVaultPath -fuzztime=1m
